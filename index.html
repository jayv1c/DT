<style>
:root{--bg:#f3f5f8;--surf:#fff;--ink:#14213d;--mute:#5b6577;--line:#dbe0e7;--acc:#2f6f8f;--onacc:#fff;--win:#3f7f64;--draw:#7d8696;--loss:#c0392b;--board:#14213d;--boardink:#f4f6f2;--yel:#f2c94c;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--surf:#171d25;--ink:#e8edf2;--mute:#9aa6b2;--line:#2a3340;--acc:#7fb8d6;--onacc:#0b1a22;--win:#6fbf9c;--draw:#8b95a3;--loss:#ef6b5b;--board:#0a0e13;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1419;--surf:#171d25;--ink:#e8edf2;--mute:#9aa6b2;--line:#2a3340;--acc:#7fb8d6;--onacc:#0b1a22;--win:#6fbf9c;--draw:#8b95a3;--loss:#ef6b5b;--board:#0a0e13;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
.board{background:var(--board);color:var(--boardink);padding:20px 16px 18px;border-bottom:4px solid var(--yel)}
.wrap{max-width:860px;margin:0 auto}
.ident{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.board input{background:transparent;border:0;border-bottom:1px dashed #ffffff55;color:inherit;font:inherit;padding:2px 0;min-width:0}
.club{font:700 clamp(28px,7vw,44px)/1.1 'Barlow Condensed',Impact,sans-serif;flex:1 1 220px}
.ses{font:600 20px 'Barlow Condensed',sans-serif;width:110px}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin:14px 0 0}
.score div{background:#ffffff14;border-radius:6px;padding:6px 10px}
.score dt{font-size:13px;opacity:.75;margin:0}
.score dd{margin:0;font:700 30px/1.1 'Barlow Condensed',sans-serif}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 12px;max-width:860px;margin:0 auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:600 16px Barlow,sans-serif;padding:12px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
main{max-width:860px;margin:0 auto;padding:16px}
h2{font:700 24px 'Barlow Condensed',sans-serif;margin:4px 0 12px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:20px;align-items:end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:2px}
input,select{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0}
.main input{width:100%}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:6px;padding:10px 14px;font:600 16px Barlow,sans-serif;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.chip{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px 'Barlow Condensed',sans-serif}
.V{background:var(--win)}.E{background:var(--draw)}.D{background:var(--loss)}
.sc{font:700 22px 'Barlow Condensed',sans-serif}
.sub{color:var(--mute);font-size:14px}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px;padding:4px 8px}
.x:hover{color:var(--loss)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);font-size:15px}
th{font-weight:600;color:var(--mute);font-size:13px;border-top:0}
td button.sm{background:var(--surf);border:1px solid var(--line);border-radius:6px;color:var(--ink);cursor:pointer;padding:2px 8px;font:600 13px Barlow,sans-serif}
.pos{color:var(--win)}.neg{color:var(--loss)}
.empty{color:var(--mute);padding:16px 0}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600}
textarea{width:100%;height:120px;margin:8px 0;font:12px monospace;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:8px}
.bud{display:flex;gap:8px;align-items:end;margin-bottom:16px}
.board select{background:transparent;color:inherit;border:0;border-bottom:1px dashed #ffffff55;font:600 22px "Barlow Condensed",sans-serif;padding:2px 0}.board option{color:#14213d}.chk{flex-direction:row;align-items:center;gap:8px;padding-bottom:10px}.chk input{width:auto}
.lr{display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}.lr .nm{flex:1 1 160px;padding-bottom:6px;font-size:16px;color:var(--ink)}.lr label:not(.nm) input{width:64px}.lr input:disabled{opacity:.4}.lu{margin-top:4px}h3{font:600 15px Barlow,sans-serif;margin:8px 0 2px}details.ed{margin:0 0 8px;border-top:0;padding-top:0}details.ed summary{font-weight:500;color:var(--mute);font-size:14px}table{min-width:700px}
.rule{grid-column:1/-1;margin:0;font-size:13px;color:var(--mute)}.ef{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:6px 0}tr.er td{background:var(--surf)}
table{min-width:860px}
.ni{width:58px;padding:4px 6px}.ni.ov{border-color:var(--acc);font-weight:600}
.bkw{background:var(--surf);border:1px solid var(--yel);border-radius:6px;padding:8px 10px;font-size:14px;margin:0 0 12px}.qb{margin:4px 0 6px;display:flex;gap:6px;flex-wrap:wrap}
.rk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.rw{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:15px}svg text{font-family:Barlow,sans-serif}
.lr{display:grid;grid-template-columns:minmax(90px,1.8fr) repeat(5,minmax(38px,1fr));gap:6px;align-items:center;padding:6px 0}.lr .nm{padding:0;font-size:15px;color:var(--ink);flex:none}.lr input[type=number]{width:100%;padding:5px 2px;text-align:center}.lh{border-top:0;padding:0}.lh span{font-size:12px;color:var(--mute);text-align:center}
details.add{margin:0 0 14px;border-top:0;padding-top:0}details.add>summary{font-weight:600;color:var(--acc);padding:4px 0}details.add form{margin-top:8px}
details.ini{margin:0;border-top:0;padding-top:0;grid-column:1/-1}details.ini summary{color:var(--mute);font-size:14px;font-weight:500}
.ni{width:50px;padding:4px 2px;text-align:center}td.act{white-space:nowrap}table{min-width:540px}
details.bkd{margin-top:16px}
.nav{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 10px;color:var(--ink);font:500 17px Barlow,sans-serif;cursor:pointer;text-align:left}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surf);margin:16px 0}.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:16px}.card .sr:nth-child(odd){background:var(--bg)}.sr .ni{width:80px}
.cc{background:var(--board);color:var(--boardink);border-radius:12px;padding:12px 14px;margin:0 0 10px}.cn{font:700 20px 'Barlow Condensed',sans-serif}.cs{font-size:14px;opacity:.8;margin-bottom:6px}.cr{display:flex;gap:8px;align-items:center}.cr input{flex:1;background:transparent;color:inherit;border:0;border-bottom:1px dashed #ffffff55;border-radius:0;padding:4px 0}.cr .x{color:inherit;opacity:.7}
:root{--s-GOL:#b7791f;--s-DEF:#2f6fcf;--s-MEI:#3b8a67;--s-ATQ:#c93a3a}
.pb{display:inline-block;min-width:34px;text-align:center;padding:1px 6px;border-radius:4px;color:#fff;font:700 12px Barlow,sans-serif;letter-spacing:.3px}
.s-GOL{background:var(--s-GOL)}.s-DEF{background:var(--s-DEF)}.s-MEI{background:var(--s-MEI)}.s-ATQ{background:var(--s-ATQ)}
.nn{display:inline-block;min-width:22px;font:700 15px 'Barlow Condensed',sans-serif;color:var(--mute)}
.so{display:inline-flex;flex-direction:row;align-items:center;gap:6px;margin:0 0 10px;font-size:14px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:0 0 10px}.tools .so{margin:0}.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip2{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:4px 10px;font:600 13px Barlow,sans-serif;cursor:pointer}
.chip2.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#fff}.chip2.on:not([style]){color:var(--onacc)}
details.grp{margin:14px 0 0;border-top:0;padding-top:0}details.grp>summary{font:700 19px 'Barlow Condensed',sans-serif;cursor:pointer;padding:6px 0}details.grp>summary .sub{font:400 14px Barlow,sans-serif}
.chip3{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:3px 8px 3px 12px;font-size:14px}.chip3 .x{padding:0 4px;font-size:14px}
.pl{margin:0 0 14px}
.hrow{display:grid;grid-template-columns:minmax(130px,2.4fr) repeat(5,minmax(40px,1fr));gap:6px;align-items:center}
.hrow>span:not(.hn){text-align:center;font-variant-numeric:tabular-nums}.hh{font-size:12px;color:var(--mute);padding:0 0 4px;border-bottom:1px solid var(--line)}
details.ed.hd{border-top:1px solid var(--line);margin:0}details.hd>summary{list-style:none;padding:8px 0;cursor:pointer;font-size:15px;color:var(--ink);font-weight:500}details.hd>summary::-webkit-details-marker{display:none}
.hn{display:flex;align-items:center;gap:6px;min-width:0}.ar{font-style:normal;color:var(--mute)}details[open]>summary .ar{display:inline-block;transform:rotate(90deg)}
.hrow{grid-template-columns:minmax(130px,2.2fr) repeat(7,minmax(38px,1fr))}.hlist{min-width:600px}
.board input,.board select{border-bottom-color:color-mix(in srgb,currentColor 45%,transparent)}
input[type=color]{height:40px;padding:2px;min-width:70px}
table.cmp{min-width:0}.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center}.cmp td.best{font-weight:700;color:var(--win)}
.leg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;margin:4px 0 0}.leg span{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:8px}
details.gone{opacity:.5}details.gone[open],details.gone:hover{opacity:1}
.ht{padding:8px 0;border-bottom:2px solid var(--line);font-weight:700;font-size:15px}
.pkov{position:fixed;left:0;right:0;top:0;height:100%;z-index:100;background:var(--bg);flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;box-sizing:border-box}
.pkh{display:flex;gap:8px;align-items:center}.pkh input{flex:1;font-size:17px;padding:12px}
.pkt{font-size:13px;color:var(--mute);padding:6px 2px}
.pkl{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.pki{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:500 17px Barlow,sans-serif;padding:13px 6px;cursor:pointer}.pki.free{color:var(--acc);font-weight:600}
input.pk{cursor:pointer}
form.fc>*{grid-column:1/-1}table.tc{min-width:0}.tc td:first-child{width:44px;text-align:center}.tc .ni{width:64px}
.tro{display:flex;align-items:center;gap:8px}.up{cursor:pointer;text-decoration:underline;font-size:13px}

/* ===== camada visual: navegação, placar, painel, estante, gráficos, tipografia ===== */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h2{font:700 27px/1.1 'Barlow Condensed',sans-serif;margin:24px 0 10px}
h3{font:600 15px Barlow,sans-serif;color:var(--mute);margin:16px 0 4px}
td+td{font:600 18px 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:0;max-width:none;margin:0;padding:0 0 env(safe-area-inset-bottom,0px);background:var(--surf);border-top:1px solid var(--line);overflow:visible}
nav#tabs>button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;border:0;border-bottom:0;background:none;color:var(--mute);font:500 11px Barlow,sans-serif;min-width:0}
nav#tabs>button svg{width:24px;height:24px}
nav#tabs>button[aria-selected=true]{color:var(--acc);font-weight:700;border-bottom-color:transparent}
.mback{position:fixed;inset:0;z-index:-1}
.msheet{position:absolute;right:8px;bottom:calc(100% + 8px);background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.msheet button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:500 17px Barlow,sans-serif;padding:12px 14px;border-radius:8px;cursor:pointer}
.msheet button[aria-current]{color:var(--acc);font-weight:700}
.mrow{background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--draw);border-radius:12px;margin:0 0 10px;overflow:hidden}
.mrow.mV{border-left-color:var(--win)}.mrow.mD{border-left-color:var(--loss)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 12px 6px}
.sb .t{font:500 16px Barlow,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sb .t.l{text-align:right}.sb .t.me{font-weight:700}
.mini-crest{width:26px;height:26px;object-fit:contain;vertical-align:middle;flex:none;margin:0 5px}
.head-club-avatar{display:inline-flex;align-items:center;justify-content:center;flex:none}.head-club-avatar img{width:34px;height:34px;object-fit:contain}.head-club-avatar .avt{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.sb .t{display:flex;align-items:center;gap:3px}.sb .t.l{justify-content:flex-end}.vs .avp img{width:100%;height:100%;object-fit:contain;padding:5px}
.sc2{display:flex;align-items:center;gap:8px;background:var(--board);color:var(--boardink);border-radius:8px;padding:2px 14px;font:700 40px/1.15 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;box-shadow:inset 0 -3px 0 rgba(255,255,255,.08)}
.sc2 i{font-style:normal;font-size:22px;opacity:.45}
.mm{display:flex;align-items:center;gap:8px;padding:0 10px 8px 12px}.mm .x{margin-left:auto}
.rs{font:700 13px Barlow,sans-serif}.rs.V{color:var(--win)}.rs.D{color:var(--loss)}.rs.E{color:var(--mute)}
.mrow details.ed{margin:0;padding:0 12px 8px;border-top:1px solid var(--line)}
.mrow details.ed>summary{padding-top:8px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 4px;color:var(--ink);font:500 13px Barlow,sans-serif;cursor:pointer;text-align:center}
.qa svg{width:24px;height:24px;color:var(--acc)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;background:var(--board);color:var(--boardink);border-radius:14px;padding:16px 18px;margin:0 0 12px}
.hero .big{display:block;font:700 66px/.95 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.hero .sub2{display:block;font-size:13px;opacity:.78}
.hero .hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hero .sd{font:700 20px 'Barlow Condensed',sans-serif;opacity:1}
.dots{display:flex;gap:5px}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 12px 'Barlow Condensed',sans-serif}
.dot.V{background:var(--win)}.dot.E{background:var(--draw)}.dot.D{background:var(--loss)}
.ch0{display:flex;justify-content:space-between;align-items:center;margin:6px 0 4px}.ch0 h3{margin:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile b{display:block;font:700 36px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:12.5px;color:var(--mute);margin-top:4px}
.tile .ni{width:100%;font-size:26px}
.hls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.tile.wide span{margin:0 0 2px}.tile.wide b.nm{font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile.wide em{font-style:normal;font-size:13px;color:var(--acc);font-weight:600}
.card.cp{padding:0 0 4px}
.hl1{margin:0 0 6px;font-size:15px}.big2{font:700 34px 'Barlow Condensed',sans-serif;margin-right:4px}
.cab{background:linear-gradient(180deg,#232a3a,#161b27);border-radius:14px;padding:6px 8px 12px;margin:8px 0 12px;color:#eef1f5}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:16px 2px 0;align-items:end}
.plank{height:10px;margin:0 -2px 8px;border-radius:2px;background:linear-gradient(#b27f45,#7b5128);box-shadow:0 4px 8px rgba(0,0,0,.4)}
.ti{text-align:center;min-width:0}.tw{position:relative;display:inline-block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.cnt{position:absolute;right:-12px;bottom:-4px;background:var(--yel);color:#161b27;border-radius:999px;font:700 13px 'Barlow Condensed',sans-serif;padding:1px 7px}
.tn{font:600 13px Barlow,sans-serif;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ty{font-size:11.5px;opacity:.7;line-height:1.3;max-height:2.6em;overflow:hidden}
.tu{margin:2px 0 6px;font-size:12px}.tu .up{opacity:.7}.tu .x{color:inherit;padding:0 4px;font-size:12px}
.ln{stroke-dasharray:1;animation:dr .9s ease-out both}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:gr .55s ease-out both}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes gr{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.ln,.bar{animation:none}}

/* ===== cartas de jogador ===== */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 8px}
@media (min-width:560px){.cards{grid-template-columns:repeat(3,1fr)}}
.pcard{position:relative;height:178px;border:0;border-radius:14px 14px 24px 24px;padding:0;text-align:left;cursor:pointer;color:var(--ct);background:var(--cg);box-shadow:inset 0 0 0 1.5px var(--cb),0 2px 0 rgba(0,0,0,.2);overflow:hidden}
.pcard>span{position:absolute}
.pc-ov{left:12px;top:8px;font:700 46px/1 'Barlow Condensed',sans-serif}
.pc-pos{left:12px;top:58px}
.pc-nat{left:12px;top:86px;font-size:13px;font-weight:600}
.pc-nr{right:12px;top:10px;font:700 18px 'Barlow Condensed',sans-serif;opacity:.7}
.pc-av{right:12px;top:34px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font:700 30px 'Barlow Condensed',sans-serif}
.pc-name{left:12px;right:12px;bottom:34px;font:700 21px/1.05 'Barlow Condensed',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-top:1px solid var(--cb);padding-top:6px}
.pc-st{left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;font-size:12px}

<script>
const KEY='carreira-tecnico-v1';
const ns=()=>({m:[],p:[],t:[],res:[],aw:[],obs:''});
function fresh(club){return{club,budget:50,cur:'2021/22',order:['2021/22'],data:{'2021/22':ns()}}}
let S=fresh('Meu clube');
function mig(o){
  if(!(o.matches||o.players||o.transfers||o.seasons))return o;
  const n={club:o.club||'Meu clube',budget:o.budget||0,cur:o.season||'2026/27',order:[],data:{}};
  const g=s=>{if(!n.data[s]){n.data[s]=ns();n.order.push(s)}return n.data[s]};
  g(n.cur);
  (o.matches||[]).forEach(x=>g(x.s).m.push({d:x.d,adv:x.adv,loc:x.loc,gp:x.gp,gc:x.gc,c:x.c}));
  (o.transfers||[]).forEach(x=>g(x.s).t.push({tipo:x.tipo,j:x.j,cl:x.cl,v:x.v}));
  (o.players||[]).forEach(p=>g(n.cur).p.push(p));
  (o.seasons||[]).forEach(x=>{const d=g(x.s);d.pos=x.pos;d.tit=x.tit;d.obs=x.obs});
  return n;
}
let IX={cur:'c1',list:[{id:'c1',name:'Meu clube'}]};
try{const r=localStorage.getItem('carreiras-v1');if(r)IX=JSON.parse(r)}catch(e){}
const keyOf=id=>id==='c1'?KEY:'carreira-'+id;
const saveIx=()=>{try{localStorage.setItem('carreiras-v1',JSON.stringify(IX))}catch(e){}};
let CL={db:null,uid:null,st:'',conf:[],t:null,assetT:null},UNDO=null,undoT=null,openT=null,sub={};

function loadCur(){S=fresh('Meu clube');try{const r=localStorage.getItem(keyOf(IX.cur));if(r)S=mig(JSON.parse(r))}catch(e){}fix();syncName()}
const nk=()=>{S.nk=(S.nk||1000)+1;return S.nk};
function fix(){S.order.forEach(s=>{const d=S.data[s];d.res=d.res||[];d.aw=d.aw||[];if(d.pos){d.res.push({c:'Liga nacional',r:d.pos});d.pos=''}if(d.tit){d.res.push({c:d.tit,r:'Campeão'});d.tit=''}d.p.forEach(p=>{if(!p.k)p.k=nk();if(p.ovr){const a=auto(p,d),b={};['j','g','a','y','r'].forEach(f=>{if(p.ovr[f]!=null&&p.ovr[f]-a[f])b[f]=p.ovr[f]-a[f]});if(p.ovr.n!=null)b.n=p.ovr.n;if(Object.keys(b).length)p.base=b;delete p.ovr}})});S.order.sort();if(S.order.length===1&&S.order[0]==='2026/27'){const d=S.data['2026/27'];if(!d.m.length&&!d.p.length&&!d.t.length&&!d.res.length){S.data={'2021/22':d};S.order=['2021/22'];S.cur='2021/22'}}}
loadCur();
function goSeason(s){if(!S.data[s]){S.data[s]=ns();S.order.push(s);S.order.sort()}S.cur=s;draft={};editK=null;save();render()}
const persist=()=>{try{localStorage.setItem(keyOf(IX.cur),JSON.stringify(S))}catch(e){}};
const save=()=>{S.ts=Date.now();persist();cloudSoon()};

const fm=n=>n.toLocaleString('pt-BR',{maximumFractionDigits:2});

function recM(d){let v=0,e=0,l=0,gp=0,gc=0;d.m.forEach(x=>{gp+=x.gp;gc+=x.gc;x.gp>x.gc?v++:x.gp<x.gc?l++:e++});return{v,e,l,gp,gc}}
function rec(d){const m=recM(d),b=d.tb||{},z=n=>Math.max(0,n);const r={v:z(m.v+(b.v||0)),e:z(m.e+(b.e||0)),l:z(m.l+(b.d||0)),gp:z(m.gp+(b.gf||0)),gc:z(m.gc+(b.gs||0))};r.j=b.j!=null?z(d.m.length+b.j):r.v+r.e+r.l;return r}
const sg=t=>t.tipo==='venda'||t.tipo==='empout'?1:-1;
const net=d=>d.t.reduce((a,t)=>a+sg(t)*t.v,0);
function cashBefore(){let c=S.budget;for(const s of S.order){if(s===S.cur)break;c+=net(S.data[s])}return c}

function head(){
  const r=rec(D()),cash=cashBefore()+net(D());

  ${S.order.length>1?`<select aria-label="Temporada" onchange="goSeason(this.value)">${seasonOpts()}</select>`:`<span class="season-label">${esc(S.cur)}</span>`}</div>
  </div></header>`;
}

function retro(name){
  const q=(name||'').trim().toLowerCase();if(!q)return null;
  const r={j:0,v:0,e:0,d:0,gp:0,gc:0,last:''};
  S.order.forEach(s=>S.data[s].m.forEach(m=>{
    if((m.adv||'').trim().toLowerCase()!==q)return;
    r.j++;r.gp+=m.gp;r.gc+=m.gc;m.gp>m.gc?r.v++:m.gp<m.gc?r.d++:r.e++;
    r.last=(m.gp>m.gc?'V':m.gp<m.gc?'D':'E')+' '+m.gp+'–'+m.gc+' ('+s+')';
  }));
  return r.j?r:null;
}
function updRet(){

  const n=f.elements.adv.value.trim(),r=retro(n);
  el.textContent=r?`Retrospecto contra ${n}: ${r.j} jogo(s), ${r.v}V ${r.e}E ${r.d}D, gols ${r.gp}–${r.gc}. Último: ${r.last}`:(n?'Primeira vez contra este adversário.':'');
}
function ties(d=D()){
  const T={};
  d.m.forEach(m=>{
    if(!isKO(m.ph)||!m.c)return;
    const base=m.ph.replace(legRe,''),k=m.c+'|'+base;
    const t=T[k]=T[k]||{c:m.c,base,legs:[],two:false};
    t.legs.push(m);if(legRe.test(m.ph))t.two=true;
  });
  return Object.values(T).map(t=>{
    const gp=t.legs.reduce((a,m)=>a+m.gp,0),gc=t.legs.reduce((a,m)=>a+m.gc,0);
    const pm=[...t.legs].reverse().find(m=>m.pg!=null&&m.pc!=null);
    const need=t.two?2:1,adv=t.legs[t.legs.length-1].adv;
    let res;
    if(t.legs.length<need)res='andamento';
    else if(gp>gc)res='avancou';else if(gp<gc)res='eliminado';
    else if(pm&&pm.pg>pm.pc)res='avancou';else if(pm&&pm.pg<pm.pc)res='eliminado';
    else res='empate';
    return{...t,gp,gc,pen:pm?[pm.pg,pm.pc]:null,adv,res};
  });
}
function tieLbl(t){
  if(t.res==='andamento')return '⏳ Em andamento';
  if(t.res==='empate')return '⚠️ Empate no agregado: informe os pênaltis';
  const w=t.res==='avancou';
  if(/^Final/.test(t.base))return w?'🏆 Campeão':'Vice-campeão';
  if(/3º|bronze/.test(t.base))return w?'Venceu':'Perdeu';
  return w?'✅ Avançou':'❌ Eliminado';
}

function campanhas(){
  const best={};
  ties().forEach(t=>{
    const st=(RULES[t.c]||[0,[]])[1],ix=st.findIndex(s=>s.replace(legRe,'')===t.base);
    if(!best[t.c]||ix>best[t.c].ix)best[t.c]={...t,ix};
  });
  return Object.values(best).map(t=>{
    let r=null;
    if(/^Final/.test(t.base)){if(t.res==='avancou')r='Campeão';else if(t.res==='eliminado')r='Vice-campeão'}
    else if(t.res==='eliminado')r=RES.includes(t.base)?t.base:'Eliminado';
    return r?{c:t.c,r}:null;
  }).filter(Boolean);
}

let gid=0;
function svgChart(labels,vals,o={}){
  if(!vals.length)return '<p class="sub">Sem dados ainda.</p>';
  const W=560,H=o.h||200,pl=44,pr=14,pt=26,pb=28,n=vals.length,f=o.fmt||(v=>String(v));
  let mn=o.min!=null?o.min:Math.min(0,...vals),mx=o.max!=null?o.max:Math.max(0,...vals);
  if(mx===mn)mx=mn+1;
  const sp=mx-mn,y=v=>pt+(H-pt-pb)*(1-(v-mn)/sp),iw=W-pl-pr,bw=iw/n,xb=i=>pl+bw*(i+.5),xl=i=>n===1?pl+iw/2:pl+i*iw/(n-1);
  const base=y(Math.max(mn,Math.min(0,mx))),id='g'+(++gid),st=Math.max(1,Math.ceil(n/9)),all=n<=8;
  const tx=(x,yy,t,an,s2)=>`<text x="${x}" y="${yy}" text-anchor="${an||'middle'}" style="fill:var(--mute);font-size:11px;${s2||''}">${esc(t)}</text>`;
  let g=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.4"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs>`;
  [0,.5,1].forEach(t=>{const yy=y(mn+(mx-mn)*t);g+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" style="stroke:var(--line);stroke-dasharray:${t?'3 4':'0'}"/>`});
  g+=tx(pl-6,y(mx)+4,f(mx),'end')+tx(pl-6,y(mn)+4,f(mn),'end');
  if(o.bar){
    vals.forEach((v,i)=>{const yy=y(v),last=i===n-1;
      g+=`<rect class="bar" x="${xb(i)-bw*.3}" y="${Math.min(yy,base)}" width="${bw*.6}" height="${Math.max(Math.abs(yy-base),1)}" rx="4" style="fill:var(--acc);opacity:${last?1:.72};animation-delay:${i*45}ms"/>`+tx(xb(i),v>=0?yy-6:yy+14,f(v),'middle',last?'fill:var(--ink);font-weight:700':'');
    });
  }else{
    const pts=vals.map((v,i)=>xl(i)+','+y(v)).join(' ');
    if(n>1)g+=`<polygon points="${xl(0)},${base} ${pts} ${xl(n-1)},${base}" style="fill:url(#${id})"/>`;
    g+=`<polyline class="ln" pathLength="1" fill="none" points="${pts}" style="stroke:var(--acc);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/>`;
    vals.forEach((v,i)=>{
      const last=i===n-1;
      if(last)g+=`<circle cx="${xl(i)}" cy="${y(v)}" r="10" style="fill:var(--acc);opacity:.2"/>`;
      if(all||last)g+=`<circle cx="${xl(i)}" cy="${y(v)}" r="${last?5:3.5}" style="fill:var(--acc)"/>`+tx(xl(i),y(v)-(last?14:9),f(v),'middle',last?'fill:var(--ink);font-weight:700':'');
    });
  }
  labels.forEach((l,i)=>{if(i%st===0||i===n-1)g+=tx(o.bar?xb(i):xl(i),H-9,l)});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.t||'Gráfico')}">${g}</svg>`;
}
function ovrChart(k){

  if(!V.length)return '<p class="sub">Sem overall registrado para este jogador.</p>';
  return svgChart(L,V,{min:Math.max(0,Math.min(...V)-4),max:Math.min(99,Math.max(...V)+4),t:'Evolução do overall'});
}

async function cloudInit(){

  try{

async function pushCareer(id,L){
  const parts=JSON.stringify(L).match(/[\s\S]{1,100000}/g)||[''];
  for(let i=0;i<parts.length;i++)await cd('c-'+id+'-'+i).set({t:parts[i]});
  await cd('c-'+id).set({n:parts.length,ts:L.ts||0,name:L.club||''});
  L.sts=L.ts||0;
  if(id===IX.cur)persist();else try{localStorage.setItem(keyOf(id),JSON.stringify(L))}catch(e){}
}
async function pushClubDb(){
  const json=JSON.stringify(CLUB_DB),parts=json.match(/[\s\S]{1,100000}/g)||[''];
  for(let i=0;i<parts.length;i++)await cd('assets-'+i).set({t:parts[i]});
  await cd('assets').set({n:parts.length,ts:CLUB_DB.ts||Date.now()});
  CLUB_DB.sts=CLUB_DB.ts||Date.now();try{localStorage.setItem(CLUB_DB_KEY,JSON.stringify(CLUB_DB))}catch(e){}
}
async function syncClubDb(){
  const h=await cd('assets').get();
  if(!h.exists){if(Object.keys(CLUB_DB.images||{}).length||CLUB_DB.clubs?.length)await pushClubDb();return}
  const cloudTs=h.data().ts||0,localTs=CLUB_DB.ts||0,base=CLUB_DB.sts||0;
  if((localTs>base&&cloudTs>base)||(!base&&(!localTs)&&((CLUB_DB.clubs||[]).length||Object.keys(CLUB_DB.images||{}).length))){
    const n=h.data().n||0;let raw='';for(let i=0;i<n;i++){const p=await cd('assets-'+i).get();if(!p.exists)throw{code:'assets-incompletos'};raw+=p.data().t}
    const remote=JSON.parse(raw),merged={clubs:[...new Set([...(remote.clubs||[]),...(CLUB_DB.clubs||[])])],images:{...(remote.images||{}),...(CLUB_DB.images||{})},ts:Date.now()};CLUB_DB=merged;await pushClubDb();return
  }
  if(cloudTs>localTs||(!localTs&&cloudTs>base)){
    const n=h.data().n||0;let raw='';for(let i=0;i<n;i++){const p=await cd('assets-'+i).get();if(!p.exists)throw{code:'assets-incompletos'};raw+=p.data().t}
    CLUB_DB=JSON.parse(raw);CLUB_DB.sts=cloudTs;try{localStorage.setItem(CLUB_DB_KEY,JSON.stringify(CLUB_DB))}catch(e){}
  }else if(localTs>cloudTs)await pushClubDb();
  else{CLUB_DB.sts=cloudTs;try{localStorage.setItem(CLUB_DB_KEY,JSON.stringify(CLUB_DB))}catch(e){}}
}

async function pullCareer(id){
  const h=await cd('c-'+id).get();if(!h.exists)return;
  const n=h.data().n,ts=h.data().ts||0;let s='';
  for(let i=0;i<n;i++){const d=await cd('c-'+id+'-'+i).get();if(!d.exists)throw{code:'incompleto'};s+=d.data().t}
  const L=JSON.parse(s);L.ts=ts;L.sts=ts;
  try{localStorage.setItem(keyOf(id),JSON.stringify(L))}catch(e){}
  if(id===IX.cur){S=mig(L);fix();draft={};render()}
}
async function syncCareer(id){
  const h=await cd('c-'+id).get(),cts=h.exists?(h.data().ts||0):0;
  let L=id===IX.cur?S:null;
  if(!L)try{L=JSON.parse(localStorage.getItem(keyOf(id))||'null')}catch(e){}
  const lts=L?(L.ts||0):0,base=L?(L.sts||0):0;
  if(cts===lts)return;
  if(!h.exists){if(L)await pushCareer(id,L);return}
  if(!hasData(L)){await pullCareer(id);return}
  const lc=lts>base,cc=cts>base;
  if(lc&&cc){CL.conf.push({id,name:(IX.list.find(x=>x.id===id)||{}).name||id});return}
  if(cc)await pullCareer(id);else if(lc)await pushCareer(id,L);
}
async function cloudSync(){
  CL.conf=[];CL.st='Sincronizando…';cstUp();

  try{
    const x=await cd('ix').get();
    await syncClubDb();
    if(x.exists)(x.data().list||[]).forEach(c=>{if(!IX.list.some(y=>y.id===c.id))IX.list.push(c)});
    saveIx();
    for(const c of [...IX.list])await syncCareer(c.id);
    await cd('ix').set({list:IX.list,ts:Date.now()});
    CL.st=CL.conf.length?'Há versões diferentes. Escolha qual manter abaixo.':'Sincronizado às '+hhmm();
  }catch(e){CL.st='Falha ao sincronizar ('+((e&&e.code)||'erro')+').'}
  render();
}

let cmp={a:null,b:null,sc:'c'};
function pAgg(k,only){
  const r={j:0,g:0,a:0,y:0,r:0,ns:0,nw:0,seasons:0,last:null};
  S.order.forEach(s=>{
    if(only&&s!==only)return;
    const p=S.data[s].p.find(x=>x.k===k);if(!p)return;
    const st=stats(p,S.data[s]);
    r.j+=st.j;r.g+=st.g;r.a+=st.a;r.y+=st.y;r.r+=st.r;r.seasons++;r.last=p;
    if(st.n!=null){const w=Math.max(st.j,1);r.ns+=st.n*w;r.nw+=w}
  });
  r.pg=r.g+r.a;r.pj=r.j?r.pg/r.j:0;r.nota=r.nw?r.ns/r.nw:null;return r;
}
function svgMulti(labels,series,t){
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null));
  if(!all.length)return '<p class="sub">Sem overall registrado.</p>';
  const W=560,H=210,pl=40,pr=14,pt=22,pb=30,n=labels.length,mn=Math.max(0,Math.min(...all)-4),mx=Math.min(99,Math.max(...all)+4),sp=mx-mn||1;
  const y=v=>pt+(H-pt-pb)*(1-(v-mn)/sp),iw=W-pl-pr,x=i=>n===1?pl+iw/2:pl+i*iw/(n-1);
  const tx=(xx,yy,s,an,c)=>`<text x="${xx}" y="${yy}" text-anchor="${an||'middle'}" style="fill:${c||'var(--mute)'};font-size:11px">${esc(s)}</text>`;
  let g=`<line x1="${pl}" y1="${y(mn)}" x2="${W-pr}" y2="${y(mn)}" style="stroke:var(--line)"/>`+tx(pl-6,y(mx)+4,mx,'end')+tx(pl-6,y(mn)+4,mn,'end');
  series.forEach((se,si)=>{
    const pts=se.vals.map((v,i)=>v==null?null:[x(i),y(v),v]).filter(Boolean);
    if(pts.length>1)g+=`<polyline class="ln" pathLength="1" fill="none" points="${pts.map(q=>q[0]+','+q[1]).join(' ')}" style="stroke:${se.c};stroke-width:2.5"/>`;
    pts.forEach(q=>{g+=`<circle cx="${q[0]}" cy="${q[1]}" r="4" style="fill:${se.c}"/>`+tx(q[0],q[1]+(si?17:-8),q[2],'middle',se.c)});
  });
  labels.forEach((l,i)=>{g+=tx(x(i),H-10,l)});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t||'Gráfico')}">${g}</svg>`;
}
function vCmp(){
  const H={};
  S.order.forEach(s=>S.data[s].p.forEach(p=>{const h=H[p.k]=H[p.k]||{k:p.k,n:p.n,c:0};h.n=p.n;h.c++}));
  const pl=Object.values(H).sort((a,b)=>b.c-a.c||a.n.localeCompare(b.n,'pt-BR'));
  if(pl.length<2)return '<h2>Comparar jogadores</h2><p class="empty">Cadastre pelo menos dois jogadores para comparar.</p>';
  const ka=cmp.a&&H[cmp.a]?cmp.a:pl[0].k,kb=cmp.b&&H[cmp.b]?cmp.b:pl[1].k;
  const only=cmp.sc==='t'?S.cur:null,A=pAgg(ka,only),B=pAgg(kb,only),la=A.last||{},lb=B.last||{};
  const na=H[ka].n,nb=H[kb].n;
  const sel=(id,cur)=>`<select onchange="cmp.${id}=+this.value;render()">${pl.map(x=>`<option value="${x.k}" ${x.k===cur?'selected':''}>${esc(x.n)}</option>`).join('')}</select>`;
  const cell=(v,o,d,f)=>`<td class="${d&&v!=null&&o!=null&&(d>0?v>o:v<o)?'best':''}">${v==null?'–':(f?f(v):v)}</td>`;
  const num=[['Overall',la.ov||null,lb.ov||null,1],['Temporadas',A.seasons,B.seasons,0],['Jogos',A.j,B.j,1],['Gols',A.g,B.g,1],['Assistências',A.a,B.a,1],['Participações em gol (G+A)',A.pg,B.pg,1],['G+A por jogo',A.pj,B.pj,1,fm2],['Nota média',A.nota,B.nota,1,v=>v.toFixed(1)],['Amarelos',A.y,B.y,-1],['Vermelhos',A.r,B.r,-1]];
  const txt=(l,a,b)=>`<tr><td>${l}</td><td>${a}</td><td>${b}</td></tr>`;
  const ov=k=>S.order.map(s=>{const p=S.data[s].p.find(x=>x.k===k);return p&&p.ov?p.ov:null});
  return `<h2>Comparar jogadores</h2>
  <div class="tools"><label>Jogador A${sel('a',ka)}</label><label>Jogador B${sel('b',kb)}</label></div>
  <div class="chips" style="margin:0 0 10px"><button type="button" class="chip2${cmp.sc==='c'?' on':''}" onclick="cmp.sc='c';render()">Carreira</button><button type="button" class="chip2${cmp.sc==='t'?' on':''}" onclick="cmp.sc='t';render()">Só ${esc(S.cur)}</button></div>
  <div class="scroll"><table class="cmp"><thead><tr><th></th><th>${esc(na)}</th><th>${esc(nb)}</th></tr></thead><tbody>
  ${txt('Posição',la.pos?posBadge(la.pos):'–',lb.pos?posBadge(lb.pos):'–')}${txt('Nacionalidade',esc(la.nat||'–'),esc(lb.nat||'–'))}${txt('Idade',la.id||'–',lb.id||'–')}${txt('Pé',esc(la.foot||'–'),esc(lb.foot||'–'))}
  ${num.map(([l,a,b,d,f])=>`<tr><td>${l}</td>${cell(a,b,d,f)}${cell(b,a,d,f)}</tr>`).join('')}</tbody></table></div>
  <p class="sub">Em verde, o melhor valor de cada linha (nos cartões, o menor).</p>
  <h3>Evolução do overall</h3>${svgMulti(S.order,[{vals:ov(ka),c:'var(--s-DEF)'},{vals:ov(kb),c:'var(--s-ATQ)'}],'Evolução do overall')}
  <div class="leg"><span style="background:var(--s-DEF)"></span>${esc(na)} <span style="background:var(--s-ATQ)"></span>${esc(nb)}</div>`;
}

function totalSeasons(){
  const a=S.order.reduce((t,s)=>{const q=rec(S.data[s]);t.j+=q.j;t.v+=q.v;t.e+=q.e;t.l+=q.l;t.gp+=q.gp;t.gc+=q.gc;t.t+=S.data[s].res.filter(x=>x.r==='Campeão').length;return t},{j:0,v:0,e:0,l:0,gp:0,gc:0,t:0});
  const sd=a.gp-a.gc,ap=a.j?Math.round((a.v*3+a.e)/(a.j*3)*100):0;

}

function pkFilter(opts,q){
  const n=norm(q.trim());
  if(!n)return{items:opts.slice(0,150),exact:true,total:opts.length};
  const a=[],b=[];opts.forEach(o=>{const x=norm(o);if(x.startsWith(n))a.push(o);else if(x.includes(n))b.push(o)});
  const all=[...a,...b];
  return{items:all.slice(0,150),exact:opts.some(o=>norm(o)===n),total:all.length};
}

function clubBadgeFile(name){

  const alias=CLUB_ALIASES[raw]||raw;

function toHsl(hex){
  const n=parseInt(hex.slice(1),16),r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
  let hh=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;hh*=60}
  return[hh,s*100,l*100];
}
function fromHsl(hh,s,l){
  s/=100;l/=100;const k=n=>(n+hh/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const x=v=>Math.round(v*255).toString(16).padStart(2,'0');return '#'+x(f(0))+x(f(8))+x(f(4));
}

}

function auto(p,d=D()){
  let j=0,g=0,a=0,y=0,r=0,s=0,c=0;
  d.m.forEach(m=>{const x=m.pl&&m.pl[p.k];if(!x)return;j++;g+=+x.g||0;a+=+x.a||0;y+=+x.y||0;r+=+x.r||0;if(x.n!==''&&x.n!=null){s+=+x.n;c++}});
  return{j,g,a,y,r,n:c?s/c:null,ns:s,nc:c};
}
function stats(p,d=D()){
  const a=auto(p,d),b=p.base||{};
  let n=a.n;
  if(b.n!=null){const w=Math.max(b.j||0,0)||1;n=(a.ns+b.n*w)/(a.nc+w)}
  const z=v=>Math.max(0,v);
